# GoStanford-only mirror-balanced fine-tuning. No HM3D trajectories are used.
project_name: rvn_vint_go_stanford
run_name: vint_pg_gostanford_mirror_ft5
log_root: /autodl-fs/data/RVN-Bench-gostanford-mirror-runs
use_wandb: false
train: true

batch_size: 64
eval_batch_size: 64
epochs: 5
gpu_ids: [0]
num_workers: 8
lr: 0.00001
optimizer: adamw
clipping: false
max_norm: 1.0
scheduler: cosine
warmup: false
warmup_epochs: 0
seed: 0

model_type: vint_pointgoal
obs_encoder: efficientnet-b0
obs_encoding_size: 512
mha_num_attention_heads: 4
mha_num_attention_layers: 4
mha_ff_dim_factor: 4
late_fusion: false
pg_rcs: true
pretrained_checkpoint: /root/autodl-tmp/RVN-Bench-baseline-checkpoints/gostandford_only_epoch18.pth

normalize: true
context_type: temporal
context_size: 5
alpha: 0.5
distance:
  min_dist_cat: 0
  max_dist_cat: 20
action:
  min_dist_cat: 0
  max_dist_cat: 10
close_far_threshold: 10
len_traj_pred: 5
learn_angle: true
image_size: [96, 96]
goal_type: image

datasets:
  go_stanford:
    data_folder: /root/autodl-tmp/go_stanford
    train: /root/autodl-tmp/go_stanford_splits_seed0/train
    test: /root/autodl-tmp/go_stanford_splits_seed0/val
    waypoint_spacing: 1
    end_slack: 0
    goals_per_obs: 2
    negative_mining: true
    horizontal_flip_prob: 0.5

print_log_freq: 100
image_log_freq: 0
num_images_log: 0
eval_fraction: 0.1
wandb_log_freq: 100
eval_freq: 1
