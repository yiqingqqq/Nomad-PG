# GoStanford-only ViNT-PointGoal training for later zero-shot RVN-Bench evaluation.
# No HM3D / RVN trajectory data is used for optimization.
project_name: rvn_vint_go_stanford
run_name: vint_pg_gostanford_multidomain_init
log_root: /root/autodl-tmp/RVN-Bench-gostanford-runs
use_wandb: false
train: true

batch_size: 64
eval_batch_size: 64
epochs: 40
gpu_ids: [0]
num_workers: 8
lr: 0.0001
optimizer: adamw
clipping: false
max_norm: 1.0
scheduler: cosine
warmup: true
warmup_epochs: 4
seed: 0

model_type: vint_pointgoal
obs_encoder: efficientnet-b0
obs_encoding_size: 512
mha_num_attention_heads: 4
mha_num_attention_layers: 4
mha_ff_dim_factor: 4
late_fusion: false
pg_rcs: true
# Converted from the official multi-domain ViNT checkpoint.  This supplies
# visual/temporal weights only; the PointGoal MLP is newly initialized.
pretrained_checkpoint: /root/autodl-fs/RVN-Bench-shared/weights/vint_pg_zero_shot_rcs.pth

normalize: true
context_type: temporal
context_size: 5
alpha: 0.5
distance:
  min_dist_cat: 0
  max_dist_cat: 20
action:
  min_dist_cat: 0
  max_dist_cat: 10
close_far_threshold: 10
len_traj_pred: 5
learn_angle: true
image_size: [96, 96]
goal_type: image

datasets:
  go_stanford:
    data_folder: /root/autodl-tmp/go_stanford
    train: /root/autodl-tmp/go_stanford_splits_seed0/train
    test: /root/autodl-tmp/go_stanford_splits_seed0/val
    waypoint_spacing: 1
    end_slack: 0
    goals_per_obs: 2
    negative_mining: true

print_log_freq: 100
image_log_freq: 0
num_images_log: 0
eval_fraction: 0.1
wandb_log_freq: 100
eval_freq: 5
